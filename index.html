<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ken Li · 小工具入口</title>
<meta name="description" content="Ken Li 的小工具入口：中文學習工具、影片要點報告、足球精華索引，全部可以直接在瀏覽器開來用。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f6ef7'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3EK%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Ken Li · 小工具入口">
<meta property="og:description" content="我最近做的網頁工具，大部分是純靜態、直接開就用。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kenli0515.github.io/">
<script>
  try {
    var saved = localStorage.getItem('theme');
    if (saved && saved !== 'auto') document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip-link" href="#tools">跳到工具列表</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="./">
      <img class="avatar" src="https://github.com/kenli0515.png" alt="" width="40" height="40" loading="lazy">
      <span class="brand-text">
        <strong>Ken Li</strong>
        <small>小工具入口</small>
      </span>
    </a>
    <nav class="head-nav">
      <a href="https://github.com/kenli0515" target="_blank" rel="noopener">GitHub</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切換顯示模式">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Tools &amp; experiments</p>
    <h1>最近做的小工具</h1>
    <p class="lede">中文學習、影片整理、睇波——這裡收集我最近做的網頁工具，大部分是純靜態，按入去就直接可以用。</p>
    <p class="stats" id="stats"></p>
  </section>

  <section class="controls" aria-label="篩選工具">
    <label class="search">
      <span class="sr-only">搜尋工具</span>
      <input id="q" type="search" placeholder="搜尋工具、標籤…" autocomplete="off" spellcheck="false">
    </label>
    <div class="tag-filters" id="tagFilters" role="group" aria-label="標籤篩選"></div>
    <label class="sort">
      <span class="sr-only">排序方式</span>
      <select id="sort">
        <option value="updated">最近更新</option>
        <option value="created">最近建立</option>
        <option value="name">名稱</option>
      </select>
    </label>
  </section>

  <section id="tools" class="grid" aria-live="polite"></section>

  <p id="empty" class="empty" hidden>沒有符合的工具，試試其他關鍵字。</p>
  <p id="error" class="empty" hidden>載入不到工具清單，稍後再試。</p>
</main>

<footer class="site-foot">
  <div class="wrap foot-inner">
    <p>由 <a href="https://github.com/kenli0515/kenli0515.github.io" target="_blank" rel="noopener">GitHub Pages</a> 提供 · 資料每日自動更新</p>
    <p id="generatedAt" class="muted"></p>
  </div>
</footer>

<script src="assets/app.js" type="module"></script>
</body>
</html>
