name: Update project data

on:
  schedule:
    - cron: '0 0 * * *' # 08:00 HKT
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'projects.json'
      - 'tools/build-data.mjs'
      - '.github/workflows/update-projects.yml'

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate data/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: refresh project data"
          git push
